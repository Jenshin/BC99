<head>

  />

  <style>
    :root {
      --accent: #18b8d8;
      --accent-2: #0a8eaa;
      --panel: rgba(11, 19, 29, 0.78);
      --border: rgba(255, 255, 255, 0.16);
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
      background: #071019;
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      color: var(--text);
      background: #071019;
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background:
        linear-gradient(
          180deg,
          rgba(2, 10, 16, 0.28) 0%,
          rgba(2, 10, 16, 0.55) 55%,
          rgba(2, 10, 16, 0.94) 100%
        ),
        radial-gradient(
          circle at 50% 26%,
          rgba(0, 0, 0, 0.04),
          rgba(0, 0, 0, 0.34) 60%,
          rgba(0, 0, 0, 0.82) 100%
        ),
        url("https://bc99vip.com/background-Seth.jpg") center center / cover
          no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 12, 20, 0.25),
          transparent 25%,
          transparent 75%,
          rgba(0, 12, 20, 0.32)
        ),
        linear-gradient(
          180deg,
          transparent 55%,
          rgba(4, 11, 18, 0.72)
        );
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24%;
      z-index: -1;
      pointer-events: none;

      background: linear-gradient(
        180deg,
        transparent,
        rgba(4, 12, 19, 0.95)
      );
    }

    .hero__content {
      width: min(92vw, 740px);
      margin: 0;
      text-align: center;
      animation: fadeUp 0.9s ease both;
    }

    .logo {
      display: block;
      width: clamp(130px, 14vw, 210px);
      height: auto;
      object-fit: contain;
      margin: 0 auto 18px;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.42));
    }

    .subtitle {
      margin: 0;
      font-size: clamp(18px, 1.5vw, 24px);
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.6);
    }

    .cert {
      margin: 9px 0 0;
      font-size: clamp(13px, 1vw, 16px);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .more-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 190px;
      height: 56px;
      margin-top: 30px;
      padding: 0 34px;

      border-radius: 999px;
      color: #071019;
      background: #fff;

      font-size: 18px;
      font-weight: 900;
      text-decoration: none;

      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .more-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
    }

    .gift-label {
      margin-top: 46px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .arrow {
      display: block;
      width: 12px;
      height: 12px;
      margin: 9px auto 0;

      border-right: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);

      transform: rotate(45deg);
      animation: bounce 1.3s infinite;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;

      width: min(100%, 490px);
      margin: 64px auto 0;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 58px;
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;

      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .action:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .action--dark {
      background: var(--panel);
    }

    .action--blue {
      border-color: rgba(24, 184, 216, 0.4);
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
      box-shadow: 0 12px 28px rgba(12, 156, 187, 0.24);
    }

    .line-icon {
      display: inline-grid;
      place-items: center;

      width: 24px;
      height: 24px;
      border-radius: 7px;

      background: #06c755;
      color: #fff;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0) rotate(45deg);
      }

      50% {
        transform: translateY(7px) rotate(45deg);
      }
    }

    @media (max-height: 780px) and (min-width: 641px) {
      .hero {
        padding-top: 28px;
        padding-bottom: 28px;
      }

      .logo {
        width: 130px;
        margin-bottom: 12px;
      }

      .more-btn {
        margin-top: 22px;
        height: 50px;
      }

      .gift-label {
        margin-top: 28px;
      }

      .actions {
        margin-top: 42px;
      }
    }

@media (max-width:640px){

  .hero{
    min-height:100vh;
    min-height:100svh;

    padding:20px;
    background-position:40% center;
  }

  .hero__content{
    width:min(90vw,440px);
    min-height:calc(100svh - 40px);

    display:flex;
    flex-direction:column;
  }

  .hero-main{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:center;   /* 內容垂直置中 */
    align-items:center;
  }

  .actions{
    margin-top:auto;
    grid-template-columns:1fr;
    width:100%;
    padding-bottom:env(safe-area-inset-bottom,18px);
  }

}

  .action {
    min-height: 54px;
  }
}
  </style>
</head>

      <div class="actions" id="actions">

      </div>
    </section>
  </main>
</body>
</html>
